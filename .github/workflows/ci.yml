name: ci

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/faultline.py --json
      - name: Bootstrap stable Direct Mode runner bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/gltest-direct"
          bundle="$(find "$HOME/.cache/genvm-linter" -maxdepth 2 -type f -name 'genvm-universal-*.tar.xz' -print | sort -V | tail -n 1)"
          test -n "$bundle"
          cp "$bundle" "$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz"
      - run: pytest tests/direct/ -v
      - run: python scripts/check_release.py

  integration:
    runs-on: ubuntu-latest
    needs: contract
    env:
      FAULTLINE_CONTRACT: "0x7655d42C17a8aE1E126af4982A901Bd121cDf221"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/integration/ -v -s

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  hosted_frontend:
    runs-on: ubuntu-latest
    needs: frontend
    env:
      FAULTLINE_FRONTEND_URL: "https://faultline-eight-lemon.vercel.app/"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_hosted_frontend.py
